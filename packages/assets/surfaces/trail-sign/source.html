<!-- Surface source: a painted wooden trail sign (512x384). Self-contained: CSS only,
     bundled font via relative path into packages/motion/fonts. Baked by
     scripts/bake-surfaces.mjs → art.png (the committed canonical bytes). -->
<!doctype html><meta charset="utf-8">
<style>
  @font-face { font-family: Bebas; src: url("../../../motion/fonts/BebasNeue-Regular.ttf"); }
  html, body { margin: 0; width: 512px; height: 384px; overflow: hidden; }
  body {
    background:
      repeating-linear-gradient(93deg, #7a5230 0 26px, #6d4728 26px 30px, #75502e 30px 55px, #684324 55px 58px),
      #75502e;
  }
  .grain { position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 220px 26px at 88px 300px, rgba(58,36,16,.55) 0 40%, transparent 70%),
      radial-gradient(ellipse 180px 20px at 420px 70px, rgba(58,36,16,.45) 0 40%, transparent 70%),
      linear-gradient(180deg, rgba(255,235,200,.10), transparent 30%, rgba(20,10,0,.18) 95%);
  }
  .edge { position: absolute; inset: 10px; border: 5px solid rgba(43,26,12,.65); border-radius: 6px; }
  h1 { position: absolute; top: 46px; width: 100%; margin: 0; text-align: center;
       font: 92px/1 Bebas, sans-serif; letter-spacing: 6px; color: #f3e2b8;
       text-shadow: 0 3px 0 rgba(30,16,4,.6); }
  .arrow { position: absolute; top: 208px; left: 76px; width: 300px; height: 54px; background: #f3e2b8;
           box-shadow: 0 3px 0 rgba(30,16,4,.6); }
  .arrow::after { content: ""; position: absolute; right: -66px; top: -27px;
                  border: 54px solid transparent; border-left: 68px solid #f3e2b8;
                  filter: drop-shadow(0 3px 0 rgba(30,16,4,.6)); }
  .sub { position: absolute; top: 292px; width: 100%; text-align: center;
         font: 40px/1 Bebas, sans-serif; letter-spacing: 10px; color: #e8d3a4; }
  .nail { position: absolute; width: 14px; height: 14px; border-radius: 50%;
          background: radial-gradient(circle at 35% 30%, #b9b2a6, #4a4238 70%); }
</style>
<div class="grain"></div><div class="edge"></div>
<h1>THE POND</h1>
<div class="arrow"></div>
<div class="sub">HALF A MILE</div>
<div class="nail" style="left:24px;top:24px"></div><div class="nail" style="right:24px;top:24px"></div>
<div class="nail" style="left:24px;bottom:24px"></div><div class="nail" style="right:24px;bottom:24px"></div>
