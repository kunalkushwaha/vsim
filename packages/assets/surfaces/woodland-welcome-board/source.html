<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: 'Bebas'; src: url("../../../motion/fonts/BebasNeue-Regular.ttf"); }
html,body { margin:0; width:1024px; height:640px; overflow:hidden; background:#000; }
* { box-sizing: border-box; }
.stage {
  position:relative; width:1024px; height:640px; overflow:hidden;
  font-family:'Bebas', sans-serif;
  background: linear-gradient(180deg, #201232 0%, #3a2044 20%, #6b3450 42%, #a85148 62%, #d98246 78%, #f2b25c 100%);
}
.stars {
  position:absolute; top:34px; left:70px; width:4px; height:4px; border-radius:50%;
  background:#fff6d8;
  box-shadow:
    90px 18px 0 0 rgba(255,246,216,0.85),
    150px 60px 0 -1px rgba(255,246,216,0.6),
    230px 10px 0 0 rgba(255,246,216,0.7),
    310px 44px 0 -1px rgba(255,246,216,0.55),
    400px 4px 0 0 rgba(255,246,216,0.8),
    470px 34px 0 -1px rgba(255,246,216,0.5),
    560px 14px 0 0 rgba(255,246,216,0.75),
    640px 50px 0 -1px rgba(255,246,216,0.5),
    720px 6px 0 0 rgba(255,246,216,0.8),
    790px 38px 0 -1px rgba(255,246,216,0.55),
    860px 16px 0 0 rgba(255,246,216,0.7),
    880px 60px 0 -1px rgba(255,246,216,0.45);
  opacity:0.9;
}
.treeline {
  position:absolute; left:-40px; bottom:56px; width:1104px; height:150px;
  background:#170f1c;
  clip-path: polygon(0% 100%,0% 68%,5% 38%,10% 74%,15% 28%,20% 66%,25% 42%,30% 78%,35% 32%,40% 62%,45% 22%,50% 68%,55% 38%,60% 76%,65% 28%,70% 58%,75% 44%,80% 72%,85% 34%,90% 62%,95% 40%,100% 68%,100% 100%);
  opacity:0.92;
}
.ground {
  position:absolute; left:0; right:0; bottom:0; height:66px;
  background: linear-gradient(180deg,#160f14,#060305);
}
.post {
  position:absolute; top:0; width:54px; height:640px;
  background: linear-gradient(90deg,#150b05 0%, #47280f 16%, #6b4423 48%, #47280f 82%, #150b05 100%);
  box-shadow: inset 0 0 22px rgba(0,0,0,0.65);
}
.post::after {
  content:""; position:absolute; inset:0;
  background: repeating-linear-gradient(180deg, rgba(0,0,0,0.18) 0 3px, transparent 3px 10px);
  mix-blend-mode: multiply;
}
.post.left { left:24px; }
.post.right { right:24px; }
.crossbeam {
  position:absolute; top:34px; left:24px; width:976px; height:60px; border-radius:6px;
  background: linear-gradient(180deg,#6b451f,#3a2410 70%, #2a1a0c);
  box-shadow: 0 8px 0 rgba(0,0,0,0.35), inset 0 -6px 10px rgba(0,0,0,0.5), inset 0 4px 8px rgba(255,205,140,0.18);
}
.crossbeam::after {
  content:""; position:absolute; inset:0; border-radius:6px;
  background: repeating-linear-gradient(90deg, rgba(0,0,0,0.14) 0 3px, transparent 3px 12px);
  mix-blend-mode: multiply;
}
.bough { position:absolute; top:8px; width:64px; height:34px; }
.bough .needle {
  position:absolute; bottom:0; width:0; height:0;
  border-left:10px solid transparent; border-right:10px solid transparent;
  border-bottom:26px solid #253a1e;
}
.bough .berry { position:absolute; width:7px; height:7px; border-radius:50%; background: radial-gradient(circle at 35% 30%, #ffd27a, #c8781f 70%); }
.chain { position:absolute; top:94px; width:4px; height:32px; background:#2b2b2b; box-shadow: 0 0 2px rgba(0,0,0,0.6); }
.lantern { position:absolute; top:124px; width:46px; height:64px; }
.lantern .cap { position:absolute; top:-10px; left:9px; width:28px; height:13px; background:#241407; clip-path: polygon(50% 0,100% 100%,0% 100%); }
.lantern .body {
  position:absolute; inset:2px 0 12px 0; border:3px solid #241407; border-radius:8px 8px 12px 12px;
  background: radial-gradient(circle at 50% 38%, #ffe9a8, #ffb043 55%, #a8591a 100%);
  box-shadow: 0 0 34px 14px rgba(255,175,70,0.55), 0 0 90px 40px rgba(255,140,50,0.28);
}
.lantern .bar { position:absolute; top:14px; left:6px; right:6px; height:2px; background:rgba(40,20,8,0.6); }
.lantern .base { position:absolute; bottom:0; left:11px; width:24px; height:9px; background:#241407; border-radius:2px; }
.rope {
  position:absolute; top:94px; width:6px; height:140px;
  background: repeating-linear-gradient(48deg,#8a6a3a 0 4px, #5c4423 4px 8px);
  box-shadow: 1px 0 3px rgba(0,0,0,0.4);
}
.board {
  position:absolute; top:234px; left:200px; width:624px; height:300px; border-radius:10px;
  background:
    repeating-linear-gradient(92deg, rgba(0,0,0,0.06) 0 2px, transparent 2px 42px),
    linear-gradient(100deg, #7d4c27 0%, #5c3a21 24%, #6e4429 50%, #4a2c17 76%, #6b432a 100%);
  box-shadow:
    0 24px 46px rgba(0,0,0,0.55),
    inset 0 0 0 6px #241407,
    inset 0 0 0 11px #8a5a2e,
    inset 0 10px 22px rgba(255,190,120,0.16),
    inset 0 -12px 34px rgba(0,0,0,0.45);
}
.knot { position:absolute; border-radius:50%; opacity:0.55; background: radial-gradient(ellipse at center, #241407 0%, #4a2c17 45%, transparent 72%); }
.k1 { width:40px; height:28px; top:24px; left:46px; }
.k2 { width:34px; height:24px; bottom:30px; right:64px; }
.text-wrap { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.title {
  font-family:'Bebas', sans-serif; font-size:126px; letter-spacing:8px; line-height:0.9;
  color:#241407;
  text-shadow: -2px -2px 1px rgba(0,0,0,0.55), 2px 2px 1px rgba(255,205,140,0.5);
}
.subtitle {
  font-family:'Bebas', sans-serif; font-size:32px; letter-spacing:11px; margin-top:6px;
  color:#f0c98a;
  text-shadow: 1px 1px 2px rgba(0,0,0,0.6);
}
.divider { display:flex; align-items:center; gap:10px; margin-top:16px; }
.divider .line { width:70px; height:2px; background: linear-gradient(90deg, transparent, #c99a5a, transparent); }
.divider .diamond { width:10px; height:10px; background:#e0b268; transform:rotate(45deg); box-shadow: 0 0 4px rgba(0,0,0,0.4); }
.tagline {
  font-family:'Bebas', sans-serif; font-size:22px; letter-spacing:5px; margin-top:14px;
  color:#c99a5a;
  text-shadow: 1px 1px 1px rgba(0,0,0,0.5);
}
.tagline .dot { display:inline-block; width:5px; height:5px; border-radius:50%; background:#c99a5a; margin:0 12px 2px; }
</style>
</head>
<body>
<div class="stage">
  <div class="stars"></div>
  <div class="treeline"></div>
  <div class="ground"></div>

  <div class="post left"></div>
  <div class="post right"></div>
  <div class="crossbeam"></div>

  <div class="bough" style="left:40px;">
    <div class="needle" style="left:0;"></div>
    <div class="needle" style="left:16px; border-bottom-color:#2e4726;"></div>
    <div class="needle" style="left:32px;"></div>
    <div class="berry" style="left:8px; top:6px;"></div>
    <div class="berry" style="left:34px; top:2px;"></div>
  </div>
  <div class="bough" style="right:40px;">
    <div class="needle" style="left:0;"></div>
    <div class="needle" style="left:16px; border-bottom-color:#2e4726;"></div>
    <div class="needle" style="left:32px;"></div>
    <div class="berry" style="left:8px; top:6px;"></div>
    <div class="berry" style="left:34px; top:2px;"></div>
  </div>

  <div class="chain" style="left:83px;"></div>
  <div class="lantern" style="left:60px;">
    <div class="cap"></div>
    <div class="body"></div>
    <div class="bar"></div>
    <div class="base"></div>
  </div>

  <div class="chain" style="left:937px;"></div>
  <div class="lantern" style="left:914px;">
    <div class="cap"></div>
    <div class="body"></div>
    <div class="bar"></div>
    <div class="base"></div>
  </div>

  <div class="rope" style="left:217px;"></div>
  <div class="rope" style="left:801px;"></div>

  <div class="board">
    <div class="knot k1"></div>
    <div class="knot k2"></div>
    <div class="text-wrap">
      <div class="title">WELCOME</div>
      <div class="subtitle">WOODLAND FESTIVAL</div>
      <div class="divider"><div class="line"></div><div class="diamond"></div><div class="line"></div></div>
      <div class="tagline">LANTERNS<span class="dot"></span>MUSIC<span class="dot"></span>FEASTING</div>
    </div>
  </div>
</div>
</body>
</html>
